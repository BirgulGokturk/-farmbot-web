<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070c0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7f4" media="(prefers-color-scheme: light)" />
    <meta name="description" content="FarmBot akıllı tarım robotu için web yönetim paneli" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Uygulama olarak kurulabilmesi için (Raspberry Pi ekranı ve telefon) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FarmBot" />

    <!-- Premium tipografi: Sora (başlık) + Inter (gövde) + JetBrains Mono (sayısal)
         Dosyalar kendi sunucumuzdan geliyor; @font-face tanımları src/index.css'te.
         Google Fonts kaldırıldı: iki ayrı origin için DNS+TLS el sıkışması
         gerekiyordu ve Türkçe metin, Inter'in 83 KiB'lık latin-ext alt kümesini
         zorunlu kılıyordu.
         Aşağıdaki iki dosya giriş ekranında kesin kullanıldığı için önden
         çekilir. Mono yalnızca panel içinde gerektiğinde iner, o yüzden
         preload edilmiyor. Yazı tipi preload'u aynı origin'de bile
         `crossorigin` ister; olmazsa dosya ikinci kez indirilir. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tr.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/sora-tr.woff2" crossorigin />

    <title>FarmBot · Yönetim Paneli</title>

    <script>
      // Sayfa boyanmadan temayı uygula — karanlıktan aydınlığa "flaş" olmasın
      (function () {
        try {
          var saved = localStorage.getItem("farmbot-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var isDark = saved ? saved === "dark" : !prefersLight;
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          /* localStorage kapalıysa varsayılan karanlık modda kal */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
