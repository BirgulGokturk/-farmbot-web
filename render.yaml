# Render Blueprint — tek dosyadan tüm yığını yayına alır.
#
# Kullanım: Render → New → Blueprint → depoyu seç → Apply
# Oluşturulanlar: PostgreSQL + API (Docker) + statik HMI
#
# Adresler ve gizli anahtar otomatik bağlanır; elle girilecek tek şey yok.
# Robot henüz hazır olmadığı için MQTT kapalı başlar (MQTT_ENABLED=false);
# donanım bağlanınca bu değeri true yapıp broker bilgilerini girmek yeterli.

databases:
  - name: farmbot-db
    databaseName: farmbot
    user: farmbot
    plan: free
    # ÖNEMLİ: API ile aynı bölgede olmalı. Render'da farklı bölgelerdeki
    # servisler dahili bağlantı adresiyle birbirine erişemez.
    region: frankfurt

services:
  # --------------------------------------------------------------------- #
  # API (FastAPI + WebSocket)
  # --------------------------------------------------------------------- #
  - type: web
    name: farmbot-api
    runtime: docker
    plan: free
    region: frankfurt          # Türkiye'ye en yakın bölge → düşük gecikme
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # Şema göçleri konteyner açılışında uygulanır (ücretsiz katmanda
      # pre-deploy komutu yok)
      - key: RUN_MIGRATIONS_ON_START
        value: "true"

      - key: DATABASE_URL
        fromDatabase:
          name: farmbot-db
          property: connectionString

      # Render güçlü bir değer üretip saklar; kimse görmez
      - key: SECRET_KEY
        generateValue: true

      # HMI adresi AÇIKÇA yazılır.
      # `fromService ... property: host` statik siteler için güvenilir biçimde
      # doldurulmuyor; değişken boş kalınca varsayılan localhost devrede kalıyor
      # ve tarayıcıdan gelen istekler CORS'a takılıyordu.
      # Kendi alan adınızı eklerseniz virgülle ayırın.
      - key: CORS_ORIGINS
        value: https://farmbot-hmi.onrender.com

      # Robot bağlanana kadar kapalı
      - key: MQTT_ENABLED
        value: "false"
      - key: MQTT_TLS
        value: "true"
      - key: MQTT_PORT
        value: "8883"
      - key: MQTT_HOST
        sync: false            # broker hazır olunca panelden girilecek
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false

      # Üretimde demo hesap oluşturulmasın; bitki kataloğu yine yüklenir
      - key: SEED_DEMO_DATA
        value: "true"

  # --------------------------------------------------------------------- #
  # HMI (statik React uygulaması)
  # --------------------------------------------------------------------- #
  - type: web
    name: farmbot-hmi
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # API adresi açıkça yazılır (yukarıdaki CORS notuyla aynı sebep).
      # İstemci `/api/v1` son ekini ve WebSocket adresini bundan türetir.
      - key: VITE_API_URL
        value: https://farmbot-api.onrender.com
    routes:
      # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşsün
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Yazı tipleri public/ altından geldiği için adlarında içerik özeti yok;
      # kalıcı önbelleğe alınabilmeleri için ayrı kural gerekiyor.
      # DİKKAT: dosyalar yeniden üretilirse adı da değiştirilmeli, yoksa
      # tarayıcılar bir yıl boyunca eskisini kullanmaya devam eder.
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
