# Eclipse Mosquitto — FarmBot geliştirme yapılandırması
#
# UYARI: Bu dosya kimlik doğrulamayı kapalı bırakır ve yalnızca yerel
# geliştirme içindir. Üretimde aşağıdaki "ÜRETİM" bölümünü etkinleştirin.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Geliştirme dinleyicileri ---
listener 1883
allow_anonymous true

# Tarayıcıdan doğrudan MQTT denemek isterseniz (uygulama bunu kullanmaz;
# tarayıcı robotla değil backend ile konuşur)
listener 9001
protocol websockets
allow_anonymous true

# ----------------------------------------------------------------------------
# ÜRETİM — yayına almadan önce yukarıdaki `allow_anonymous true` satırlarını
# kaldırıp aşağıyı açın:
#
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
#
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# require_certificate false
#
# Parola dosyası oluşturma:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd farmbot_backend
#   docker compose exec mosquitto mosquitto_passwd    /mosquitto/config/passwd device_<uuid>
# ----------------------------------------------------------------------------
