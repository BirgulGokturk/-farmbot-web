services:
  db:
    image: postgres:16-alpine
    container_name: farmbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmbot}
      POSTGRES_DB: ${POSTGRES_DB:-farmbot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Backend, veritabanı gerçekten sorgu kabul edene kadar beklesin
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmbot} -d ${POSTGRES_DB:-farmbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: farmbot-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmbot-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-farmbot}:${POSTGRES_PASSWORD:-farmbot}@db:5432/${POSTGRES_DB:-farmbot}
      MQTT_HOST: mosquitto
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # geliştirmede canlı yeniden yükleme
      - media-data:/app/media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: farmbot-web
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules       # konteynerin kendi bağımlılıkları korunsun
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-logs:
  media-data:
